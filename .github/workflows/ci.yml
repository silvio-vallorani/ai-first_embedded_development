name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ${{ matrix.compiler }}
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug
      - name: Unit tests
        run: ctest --preset host-debug

  format:
    name: C formatting (clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang-format (same version as requirements-dev.txt)
        run: pipx install clang-format==23.1.5
      - name: Check formatting
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror --style=file

  python-tools:
    name: Python tool self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install tool dependencies
        run: python -m pip install littlefs-python==0.19.0 pyserial==3.5
      - name: Log retrieval tool
        run: python scripts/rt1180_logs.py selftest
      - name: SBOM generator
        run: python scripts/generate_sbom.py selftest

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The binary is installed directly: gitleaks-action downloads from a legacy URL that fails intermittently.
      - name: Install gitleaks 8.30.1 (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub release downloads intermittently return HTTP 504: retry before failing.
          for attempt in 1 2 3; do
            gh release download v8.30.1 -R gitleaks/gitleaks -D /tmp/gitleaks --clobber \
              -p gitleaks_8.30.1_linux_x64.tar.gz -p gitleaks_8.30.1_checksums.txt && break
            [ "${attempt}" = 3 ] && exit 1
            sleep 20
          done
          cd /tmp/gitleaks
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan the whole history for secrets
        run: /tmp/gitleaks/gitleaks git --redact --verbose --exit-code 1 .

  coverage:
    name: Host test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc
          pipx install gcovr==8.3
      - name: Build and test with coverage
        run: |
          cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="--coverage"
          cmake --build build/coverage
          ctest --test-dir build/coverage --output-on-failure
      - name: Coverage report
        run: |
          gcovr --root . --filter firmware/ build/coverage \
            --txt --cobertura build/coverage/coverage.xml \
            --html-details build/coverage/coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-coverage
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage*.html
