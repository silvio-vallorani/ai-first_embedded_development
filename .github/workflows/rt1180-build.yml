name: RT1189 embedded build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rt1180-build.yml'
      - 'sdk/**'
      - 'examples/dual_core_led_toggle/**'
      - 'docs/toolchains/MCUXPRESSO_SDK.md'
      - 'scripts/**'
      - 'requirements.txt'
      - '.vscode/**'
      - 'CMakePresets.json'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/rt1180-build.yml'
      - 'sdk/**'
      - 'examples/dual_core_led_toggle/**'
      - 'docs/toolchains/MCUXPRESSO_SDK.md'
      - 'scripts/**'
      - 'requirements.txt'
      - '.vscode/**'
      - 'CMakePresets.json'
      - 'README.md'
  workflow_dispatch:
  schedule:
    # Weekly rebuild: the vulnerability scan picks up newly published advisories.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  upstream-dual-core-baseline:
    name: Build NXP RT1180-EVK multicore baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write      # build provenance attestation
      attestations: write
    env:
      BOARD: evkmimxrt1180
      ARMGCC_DIR: ${{ github.workspace }}/toolchains/arm-gnu-toolchain-14.2.rel1
      MCUXPRESSO_SDK: ${{ github.workspace }}/mcuxpresso-sdk
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes git cmake ninja-build xz-utils

      - name: Install Arm GNU Toolchain 14.2.x
        run: |
          mkdir -p "${ARMGCC_DIR}"
          curl --fail --location --retry 3 \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz \
            --output /tmp/arm-gnu-toolchain.tar.xz
          tar -xJf /tmp/arm-gnu-toolchain.tar.xz --strip-components=1 -C "${ARMGCC_DIR}"
          echo "${ARMGCC_DIR}/bin" >> "${GITHUB_PATH}"
          "${ARMGCC_DIR}/bin/arm-none-eabi-gcc" --version

      - name: Create Python environment and initialize pinned MCUXpresso SDK
        run: bash scripts/setup_sdk.sh

      - name: Verify Python environment and upstream multicore example source
        working-directory: mcuxpresso-sdk
        run: |
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          python3 -c "import sys, yaml; print('Python:', sys.executable); print('PyYAML:', yaml.__version__)"
          test -f mcuxsdk/examples/multicore_examples/hello_world/primary/CMakeLists.txt
          test -f mcuxsdk/examples/multicore_examples/hello_world/secondary/CMakeLists.txt

      - name: Build upstream CM33 + CM7 SysBuild example
        working-directory: mcuxpresso-sdk
        run: |
          "${GITHUB_WORKSPACE}/.venv/bin/west" build -b "${BOARD}" --sysbuild \
            mcuxsdk/examples/multicore_examples/hello_world/primary \
            --config flexspi_nor_debug --toolchain armgcc \
            -Dcore_id=cm33 \
            -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/.venv/bin/python" \
            -DPython_EXECUTABLE="${GITHUB_WORKSPACE}/.venv/bin/python" -p always \
            -d "${GITHUB_WORKSPACE}/build/rt1180-baseline"

      - name: Build project CM33 + CM7 LED-toggle SysBuild application
        run: bash scripts/build_rt1180.sh

      - name: Verify project image names
        run: |
          out=build/rt1180-led-toggle
          test -f "${out}/primary/led_toggle_primary_core_cm33.elf"
          test -f "${out}/led_toggle_secondary_core/led_toggle_secondary_core_cm7.elf"
          test -f "${out}/led_toggle_secondary_core/armgcc/core1_image.bin"
          if find "${out}" -name 'hello_world_*' | grep -q .; then
            echo "::error::Template image names remain in the project build output."
            exit 1
          fi

      - name: Upload generated firmware artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rt1180-sdk-26.09.00-firmware
          path: |
            build/rt1180-baseline/**/*.elf
            build/rt1180-baseline/**/*.bin
            build/rt1180-baseline/**/*.hex
            build/rt1180-baseline/**/*.map
            build/rt1180-led-toggle/**/*.elf
            build/rt1180-led-toggle/**/*.bin
            build/rt1180-led-toggle/**/*.hex
            build/rt1180-led-toggle/**/*.map
          if-no-files-found: warn
          retention-days: 14

      - name: Build and sign MCUboot update-test images
        run: .venv/bin/python scripts/rt1180_mcuboot.py build

      - name: Upload MCUboot update-test images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rt1180-mcuboot-update-test
          path: build/rt1180-update-test/
          if-no-files-found: error
          retention-days: 30

      - name: Release guard rejects development-key images and accepts other keys
        run: |
          py=.venv/bin/python
          imgtool="${MCUXPRESSO_SDK}/mcuxsdk/middleware/mcuboot_opensource/scripts/imgtool.py"
          if "$py" scripts/rt1180_mcuboot.py check-release build/rt1180-update-test/led-toggle-1.0.0.signed.bin; then
            echo "::error::An image signed with the public NXP development key passed the release guard."
            exit 1
          fi
          tmp="$(mktemp -d)"
          "$py" "$imgtool" keygen -k "$tmp/key.pem" -t ecdsa-p256
          "$py" "$imgtool" sign --key "$tmp/key.pem" --align 4 --version 1.0.0 --slot-size 0x200000             --header-size 0x400 --pad-header build/rt1180-ut-v1/primary/led_toggle_primary_core_cm33.bin "$tmp/image.bin"
          "$py" scripts/rt1180_mcuboot.py check-release "$tmp/image.bin"
          rm -rf "$tmp"

      - name: Generate and validate the firmware SBOM (SPDX 2.3)
        run: |
          .venv/bin/python scripts/generate_sbom.py
          pipx run --spec spdx-tools==0.8.5 pyspdxtools -i build/sbom/aied-rt1180-firmware.spdx.json

      # grype is installed directly with checksum verification and retries (the action's installer
      # failed twice on HTTP 504 from GitHub release downloads).
      - name: Install grype 0.121.0 (checksum verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh release download v0.121.0 -R anchore/grype -D /tmp/grype --clobber \
              -p grype_0.121.0_linux_amd64.tar.gz -p grype_0.121.0_checksums.txt && break
            [ "${attempt}" = 3 ] && exit 1
            sleep 20
          done
          cd /tmp/grype
          grep ' grype_0.121.0_linux_amd64.tar.gz$' grype_0.121.0_checksums.txt | sha256sum --check -
          tar -xzf grype_0.121.0_linux_amd64.tar.gz grype

      - name: Scan the SBOM for known vulnerabilities
        # Fail on high or critical findings that have a fix; everything else is reported.
        run: |
          set +e
          /tmp/grype/grype sbom:build/sbom/aied-rt1180-firmware.spdx.json --only-fixed --fail-on high \
            --output table --file build/sbom/vulnerabilities.txt
          status=$?
          cat build/sbom/vulnerabilities.txt
          exit "${status}"

      - name: Publish the vulnerability report in the job summary
        if: always()
        run: |
          {
            echo '### Vulnerability scan (grype, fixable high/critical fail the build)'
            echo '```'
            cat build/sbom/vulnerabilities.txt 2>/dev/null || echo 'No report produced.'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload SBOM and vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rt1180-sbom
          path: build/sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Attest build provenance
        # Forked pull requests get no id-token permission.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/rt1180-update-test/*.bin
            build/rt1180-update-test/mcuboot_opensource_cm33.elf
            build/sbom/aied-rt1180-firmware.spdx.json
