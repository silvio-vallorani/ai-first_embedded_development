name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref group: pull requests must not cancel each other or a main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs==1.6.1
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen

      - name: Generate API documentation
        run: |
          mkdir -p build/doxygen
          doxygen --version
          doxygen Doxyfile
          test -f build/doxygen/html/index.html

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Include Doxygen in the published site
        run: |
          mkdir -p site/doxygen
          cp -a build/doxygen/html/. site/doxygen/
          test -f site/doxygen/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
