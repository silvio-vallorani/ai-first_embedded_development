name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref group: pull requests must not cancel each other or a main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen

      - name: Generate API documentation
        run: |
          mkdir -p build/doxygen
          doxygen --version
          doxygen Doxyfile
          test -f build/doxygen/html/index.html

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Include Doxygen in the published site
        run: |
          mkdir -p site/doxygen
          cp -a build/doxygen/html/. site/doxygen/
          test -f site/doxygen/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
