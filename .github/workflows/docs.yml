name: Documentation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref group: pull requests must not cancel each other or a main deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs==1.6.1
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y doxygen

      - name: Generate API documentation
        run: |
          mkdir -p build/doxygen
          doxygen --version
          doxygen Doxyfile
          test -f build/doxygen/html/index.html

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Include Doxygen in the published site
        run: |
          mkdir -p site/doxygen
          cp -a build/doxygen/html/. site/doxygen/
          test -f site/doxygen/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
