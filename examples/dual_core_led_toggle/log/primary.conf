
# --- AIED logging service (appended by scripts/build_rt1180.*) ---
# Log region: QSPI offset 0x7E0000 (CPU 0x287E0000), 32 x 4-KiB blocks = 128 KiB (ADR-0015).
CONFIG_MCUX_COMPONENT_middleware.littlefs=y
CONFIG_MCUX_COMPONENT_middleware.littlefs_mflash=y
CONFIG_MCUX_COMPONENT_component.mflash_offchip=y
CONFIG_LITTLEFS_START_ADDR=0x7E0000
CONFIG_LITTLEFS_BLOCK_SIZE=4096
CONFIG_LITTLEFS_BLOCK_COUNT=32
CONFIG_LITTLEFS_BLOCK_CYCLES=500
